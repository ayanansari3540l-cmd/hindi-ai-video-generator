
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hindi AI Video Studio</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #101322;
      color: white;
    }
    .app {
      max-width: 600px;
      margin: auto;
    }
    h1 { color: #a99bff; }
    textarea, input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 10px;
      font-size: 16px;
    }
    textarea {
      min-height: 180px;
      background: #20243a;
      color: white;
      border: 1px solid #555b78;
    }
    button {
      background: #7563ed;
      color: white;
      border: 0;
      font-weight: bold;
    }
    .scene {
      padding: 14px;
      margin: 12px 0;
      background: #20243a;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
    small { color: #c5c8dc; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🎬 Hindi AI Video Studio</h1>
    <p>Apni Hindi story ko chhote video scenes mein badlo.</p>
    <textarea id="story" placeholder="Yahan apni Hindi kahani likho..."></textarea>
    <button onclick="makeScenes()">Story ko scenes mein baanto</button>
    <div id="output"></div>
    <small>Abhi ye basic version hai. Ye scenes banata hai, AI video generate nahi karta.</small>
  </main>
  <script>
    function makeScenes() {
      const story = document.getElementById("story").value.trim();
      const output = document.getElementById("output");
      output.replaceChildren();
      if (!story) {
        output.textContent = "Pehle apni story likho.";
        return;
      }
      const sentences = story.match(/[^.!?।]+[.!?।]*/g) || [story];
      for (let i = 0; i < sentences.length; i += 3) {
        const scene = document.createElement("div");
        scene.className = "scene";
        const heading = document.createElement("h3");
        heading.textContent = "Scene " + (Math.floor(i / 3) + 1);
        const paragraph = document.createElement("p");
        paragraph.textContent = sentences.slice(i, i + 3).join(" ").trim();
        scene.append(heading, paragraph);
        output.appendChild(scene);
      }
    }
  </script>
</body>
</html>
